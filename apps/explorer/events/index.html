    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="bar">

      <span class="tag">Arkiv Rabdi / 7794095</span>

    <span class="rail label" aria-hidden="true">Events</span>

      <section class="hero">
        <p class="eyebrow">Registry <span>/ Events</span></p>
        <h1 class="compact" data-flap>Events</h1>

        <p id="status" role="status">Reading Arkiv...</p>

      </section>

      <footer class="colophon label">
        <span>Read only</span>
        <span>No backend</span>
        <span>Arkiv SDK 1.0.1</span>
      </footer>
