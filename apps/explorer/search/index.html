<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search, Hydra explorer</title>
    <style>
      :root { color-scheme: light dark; --muted: #6b7280; --line: #d1d5db; }
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 16px; }
      header a { color: inherit; text-decoration: none; font-weight: 700; font-size: 18px; }
      form { display: flex; gap: 8px; }
      input { flex: 1; font: inherit; padding: 6px 8px; min-width: 0; }
      #status { color: var(--muted); }
      #status.error { color: #b91c1c; }
      li { margin: 6px 0; word-break: break-all; }
    </style>
  </head>
  <body>
    <header><a href="../">Hydra explorer</a></header>
    <main>
      <h1>Search</h1>
      <form>
        <label for="q" hidden>Search</label>
        <input id="q" name="q" autocomplete="off" placeholder="Domain, app name, file sha256 or Swarm reference" />
        <button>Search</button>
      </form>
      <p id="status" role="status"></p>
      <ul id="results"></ul>
    </main>
    <script type="module" src="page.js"></script>
  </body>
</html>
