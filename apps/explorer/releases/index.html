<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Builds, Hydra explorer</title>
    <meta name="description" content="Every dApp frontend build Hydra has on record, read live from Arkiv." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="../assets/hydra.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="bar">
      <a class="mark" href="../">Hydra</a>
      <nav aria-label="Main">
        <a href="./" aria-current="page">Builds</a>
        <a href="../observed/">Monitor</a>
        <a href="../search/">Search</a>
        <a href="../publish/">Publish</a>
        <a href="../console/">Console</a>
      </nav>
      <span class="tag">Arkiv Rabdi / 7794095</span>
    </header>
    <span class="rail label" aria-hidden="true">Release registry</span>

    <main id="main">
      <section class="hero hero-home">
        <p class="eyebrow">Registry <span>/ Builds</span></p>
        <h1 class="compact" data-flap>Builds</h1>
        <form class="find" action="../search/" role="search">
          <label for="q">Look up a site or a build</label>
          <div class="row">
            <input id="q" name="q" autocomplete="off" spellcheck="false" placeholder="app.example.com" />
            <button class="btn">Search
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
          <p class="help">Domain, app name, file sha256 or Swarm reference.</p>
        </form>
      </section>

      <section class="section view-wrap">
        <div class="section-head">
          <h2 id="title">Latest releases</h2>
          <span class="label muted">Newest first</span>
        </div>
        <p id="status" role="status">Reading Arkiv...</p>
        <div id="view" class="view"></div>
      </section>

      <footer class="colophon label">
        <span>Read only</span>
        <span>Arkiv, plus the Hydra API for domains</span>
        <span>Arkiv SDK 1.0.1</span>
      </footer>
    </main>
    <script type="module" src="../assets/flap.js"></script>
    <script type="module" src="../src/main.js"></script>
    <script type="module" src="../assets/motion.js"></script>
  </body>
</html>
