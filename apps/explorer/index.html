<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hydra explorer</title>
    <style>
      :root { color-scheme: light dark; --muted: #6b7280; --line: #d1d5db; }
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 16px; }
      header a { color: inherit; text-decoration: none; font-weight: 700; font-size: 18px; }
      #status { color: var(--muted); }
      #status.error { color: #b91c1c; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
      td { word-break: break-all; }
      td:first-child { word-break: normal; white-space: nowrap; }
      code { font-size: 13px; }
    </style>
  </head>
  <body>
    <header><a href="./">Hydra explorer</a></header>
    <main>
      <h1 id="title">Latest releases</h1>
      <p id="status" role="status">Reading Arkiv...</p>
      <div id="view"></div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
