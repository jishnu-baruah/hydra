# Starts one indexer pass on the API and waits for it to finish. The call also wakes the free Render
# service. GitHub's schedule is best effort (it can skip runs), so the API can also run its own timer
# (INDEXER_INTERVAL_MIN). The log lists each site and the Arkiv txs.
# Needs repo secret INDEXER_TRIGGER_SECRET (same value as on Render).
name: indexer

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: indexer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wake the API
        run: curl -fsS --retry 6 --retry-all-errors --retry-delay 10 --max-time 90 https://hydra-api-5xmn.onrender.com/health
      - name: Start a pass and wait for it
        env:
          SECRET: ${{ secrets.INDEXER_TRIGGER_SECRET }}
        run: |
          api=https://hydra-api-5xmn.onrender.com
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 60 -X POST \
            -H "Authorization: Bearer $SECRET" $api/v1/indexer/run)
          case "$code" in
            202) since=$(node -e "console.log(JSON.parse(require('fs').readFileSync('out.json','utf8')).startedAt)") ;;
            409) echo "a run is already in progress, waiting for it"; since=0 ;;
            429) echo "a run started in the last 5 minutes, showing its summary"; since=-1 ;;
            *) echo "ERROR the trigger answered $code: $(cat out.json). Check INDEXER_TRIGGER_SECRET matches the API and rerun"; exit 1 ;;
          esac
          report() {
            node -e "const j=JSON.parse(require('fs').readFileSync('st.json','utf8'));const s=j.last;if(!s){console.log('no run summary yet');process.exit(0)}for(const l of s.lines??[])console.log(l);for(const t of s.txs??[])console.log('tx https://rabdi.explorer.arkiv.network/tx/'+t);for(const e of s.errors??[])console.log('ERROR',e);console.log(s.sites+' sites, '+s.written+' observations, '+(s.txs??[]).length+' txs, '+(s.errors??[]).length+' errors, '+s.ms+' ms')"
          }
          if [ "$since" = -1 ]; then
            curl -fsS --max-time 60 $api/v1/indexer/status -o st.json && report
            exit 0
          fi
          # Poll every 30 s until a 28-minute deadline (a clock, so slow polls cannot outlast the job).
          end=$(( $(date +%s) + 1680 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 30
            curl -fsS --max-time 20 $api/v1/indexer/status -o st.json || { echo "status not reachable yet, retrying"; continue; }
            done=$(node -e "const j=JSON.parse(require('fs').readFileSync('st.json','utf8'));console.log(!j.running&&j.finishedAt!=null&&j.finishedAt>=$since?'yes':'no')")
            if [ "$done" = yes ]; then report; exit 0; fi
          done
          echo "ERROR the indexer run did not finish in 28 minutes. Check the API logs on Render and rerun"
          exit 1
